# Norsk bokmål-eksempel – samme kort, språket satt til norsk bokmål
views:
  - title: Nordpolen
    path: nordpolen
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: nb
        cams:
          cams:
            - label: "CAM 01 – REINSTALLET"
            - label: "CAM 02 – LEKETØYVERKSTEDET"
            - label: "CAM 03 – POSTROMMET"
            - label: "CAM 04 – BAKERIET"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # egen Local To-do-liste (lagrer også nisselogen)
          # log_entity: input_text.nordpol_nisselogg
        elf: {}
