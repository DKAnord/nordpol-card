# Esempio italiano – stessa scheda, lingua impostata sull'italiano
views:
  - title: Polo Nord
    path: polo-nord
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: it
        cams:
          cams:
            - label: "CAM 01 – STALLA DELLE RENNE"
            - label: "CAM 02 – LABORATORIO DI GIOCATTOLI"
            - label: "CAM 03 – UFFICIO POSTALE"
            - label: "CAM 04 – PANETTERIA"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # elenco Local To-do dedicato (conserva anche il diario degli elfi)
          # log_entity: input_text.nordpol_diario_elfi
        elf: {}
