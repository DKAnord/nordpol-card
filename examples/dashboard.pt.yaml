            - label: "CAM 03 – CORREIO"
            - label: "CAM 04 – PADARIA"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # lista Local To-do dedicada (guarda também o diário dos elfos)
