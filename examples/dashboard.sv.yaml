# Svenskt exempel – samma kort, språket satt till svenska
views:
  - title: Nordpolen
    path: nordpolen
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: sv
        cams:
          cams:
            - label: "CAM 01 – RENSTALLET"
            - label: "CAM 02 – LEKSAKSVERKSTADEN"
            - label: "CAM 03 – POSTRUMMET"
            - label: "CAM 04 – BAGERIET"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # egen Local To-do-lista (sparar även nisseloggen)
          # log_entity: input_text.nordpol_nisselogg
        elf: {}
