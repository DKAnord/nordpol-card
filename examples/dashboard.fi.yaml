    path: pohjoisnapa
    icon: mdi:pine-tree
    type: panel
    background: radial-gradient(ellipse at 50% -10%, #1f3b78 0%, #0b1a3a 45%, #050b1f 100%) fixed
    cards:
      - type: custom:nordpol-board-card
        language: fi
        cams:
          cams:
            - label: "CAM 01 – POROTALLI"
            - label: "CAM 02 – LELUVERSTAS"
            - label: "CAM 03 – POSTIHUONE"
            - label: "CAM 04 – LEIPOMO"
        sleigh: { eta: "23:59" }
        nice:
          store: todo.nordpol_nice_list           # oma Local To-do -lista (tallentaa myös tonttulokin)
          # log_entity: input_text.nordpol_tonttuloki
        elf: {}
