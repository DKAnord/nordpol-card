<body>
  <div id="app"></div>
  <script src="./tz-cities.js"></script>
  <script src="./i18n.js"></script>
  <script src="./storage.js"></script>
  <script src="./audio.js"></script>
  <script src="./qr.js"></script>
  <script src="./pulse.js"></script>
  <script src="./extras.js"></script>
  <script src="./app.js"></script>
  <script>
    (function () {
      function loadCard(src, onErr) {
        var s = document.createElement("script");
        s.src = src;
        if (onErr) s.onerror = onErr;
        document.head.appendChild(s);
      }
      loadCard("./nordpol-card.js", function () {
        loadCard("../dist/nordpol-card.js");
      });

      if (
        "serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1") &&
        !new URLSearchParams(location.search).has("nosw")
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    })();
  </script>
</body>
