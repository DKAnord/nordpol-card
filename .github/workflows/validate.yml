name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main as of 2026-06-08; release tag 22.5.0 is from 2022
        with: { category: plugin }
  syntax:
    name: Syntax & browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: node --check dist/nordpol-card.js
      - name: Validate hacs.json
        run: node -e 'const h=JSON.parse(require("fs").readFileSync("hacs.json","utf8")); if(!/^\d{4}\.\d+\.\d+$/.test(h.homeassistant||"")) throw new Error("hacs.json needs homeassistant minimum version")'
      - name: Elf lists match tools/elves_data.py
        run: python3 tools/check_elves.py
      - name: Browser tests
        run: node tests/run.mjs
      - name: No private data
        run: |
          ! grep -rEn "192\.168\.|ntfy\.sh|ses-home" --include=*.js --include=*.mjs --include=*.html --include=*.yaml --include=*.md . | grep -v "README.md"
  helpers:
    name: Helper package in real Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install Home Assistant
        run: |
          pip install -q homeassistant==2026.2.3
          pip install -q ical==13.2.0 home-assistant-frontend==20260128.6 numpy==2.3.2 av==16.0.1 PyTurboJPEG==1.8.0
      - name: Run helper scripts
        run: python tests/ha/test_helpers.py
