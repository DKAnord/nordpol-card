<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nordpol Command Center</title>
  <meta http-equiv="refresh" content="3;url=./">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(160deg, #081026 0%, #050a18 100%);
      color: #fff8e7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    main {
      max-width: 420px;
      background: rgba(13, 24, 54, 0.85);
      border: 1.5px solid rgba(255, 214, 120, 0.45);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      color: #ffd878;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.5;
      color: #e4eee7;
    }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d6202f, #94111c);
      border: 1px solid rgba(255, 214, 120, 0.65);
      color: #fff8e7;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>🎅 404 — Off the Sleigh Route</h1>
    <p>That snowy trail isn't on Santa's radar. Heading back to the Nordpol Command Center…</p>
    <a href="./">🛷 Return to Nordpol</a>
  </main>
</body>
</html>
